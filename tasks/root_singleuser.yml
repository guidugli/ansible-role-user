---
- name: Set root password when a password hash is supplied
  ansible.builtin.user:
    name: root
    password: "{{ root_password }}"
  when: root_password | length > 0
  tags:
    - user
    - config

- name: Check root password status
  ansible.builtin.command: passwd -S root
  register: user_root_password_status
  changed_when: false
  failed_when: user_root_password_status.rc not in [0, 1]
  tags:
    - user
    - validate

- name: Require root password to be set or locked
  ansible.builtin.assert:
    that:
      - user_root_password_status.stdout is search('^root\s+(P|L)\b')
    fail_msg: >-
      The root account must have a password set or be locked before single-user mode is configured.
    quiet: true
  tags:
    - user
    - validate

- name: Configure rescue and emergency shells to use sulogin on systemd hosts
  ansible.builtin.lineinfile:
    path: "/usr/lib/systemd/system/{{ item }}.service"
    regexp: '^ExecStart=-'
    line: "ExecStart=-/usr/lib/systemd/systemd-sulogin-shell {{ item }}"
    create: false
  loop:
    - rescue
    - emergency
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - user
    - config
