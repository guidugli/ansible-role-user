---
# tasks file for user

- name: Validate role inputs
  ansible.builtin.include_tasks: asserts.yml
  tags:
    - user
    - validate

- name: Configure login definitions
  ansible.builtin.include_tasks: set_login_defs.yml
  when: not user_skip_config | bool
  tags:
    - user
    - config

- name: Configure critical user and group file permissions
  ansible.builtin.include_tasks: file_permissions.yml
  when: not user_skip_config | bool
  tags:
    - user
    - config

- name: Configure root password and single-user handling
  ansible.builtin.include_tasks: root_singleuser.yml
  when:
    - user_configure_single_user | bool
    - not user_skip_config | bool
  tags:
    - user
    - config

- name: Manage local users and groups
  ansible.builtin.include_tasks: user_group_management.yml
  tags:
    - user
    - config

- name: Validate and remediate existing local account settings
  ansible.builtin.include_tasks: fix_users.yml
  when: not user_skip_config | bool
  tags:
    - user
    - validate
