---
- name: Ensure libuser is installed on RedHat family systems
  ansible.builtin.package:
    name: libuser
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags:
    - user
    - install

- name: Set encryption method in /etc/libuser.conf on RedHat family systems
  ansible.builtin.lineinfile:
    path: /etc/libuser.conf
    regexp: '^\s*crypt_style\s*='
    line: "crypt_style = {{ user_encrypt_method | lower }}"
    state: present
    create: false
  when: ansible_facts['os_family'] == 'RedHat'
  tags:
    - user
    - config

- name: Configure shadow password suite parameters in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*{{ item.name }}\s+'
    line: "{{ item.name }} {{ item.value }}"
    state: present
    create: false
  loop:
    - name: PASS_MAX_DAYS
      value: "{{ user_max_days }}"
    - name: PASS_MIN_DAYS
      value: "{{ user_min_days }}"
    - name: PASS_WARN_AGE
      value: "{{ user_warn_age }}"
    - name: ENCRYPT_METHOD
      value: "{{ user_encrypt_method }}"
    - name: UMASK
      value: "{{ user_umask }}"
    - name: SHA_CRYPT_MAX_ROUNDS
      value: "{{ user_sha_crypt_max_rounds }}"
    - name: BCRYPT_MIN_ROUNDS
      value: "{{ user_bcrypt_min_rounds }}"
    - name: BCRYPT_MAX_ROUNDS
      value: "{{ user_bcrypt_max_rounds }}"
    - name: YESCRYPT_COST_FACTOR
      value: "{{ user_yescrypt_cost_factor }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.value is not none
  tags:
    - user
    - config

- name: Read current useradd defaults
  ansible.builtin.command: useradd -D
  register: user_useradd_defaults
  changed_when: false
  tags:
    - user
    - validate

- name: Configure default inactive password lock period
  ansible.builtin.command: "useradd -D -f {{ user_inactive_days }}"
  when: "'INACTIVE=' ~ user_inactive_days not in user_useradd_defaults.stdout"
  tags:
    - user
    - config

- name: Configure shell inactivity timeout
  ansible.builtin.blockinfile:
    path: /etc/profile.d/50-user-tmout.sh
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK user tmout"
    block: |
      # Set shell idle timeout to comply with local policy.
      typeset -xr TMOUT={{ user_shell_timeout }}
  tags:
    - user
    - config

- name: Configure default shell umask
  ansible.builtin.blockinfile:
    path: /etc/profile.d/60-user-umask.sh
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK user umask"
    block: |
      # Set default umask to comply with local policy.
      umask {{ user_umask }}
  tags:
    - user
    - config

- name: Normalize umask settings in system shell startup files
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(\s*umask)\s+[0-7]{3,4}'
    replace: '\1 {{ user_umask }}'
  loop:
    - /etc/profile
    - "{{ user_bash_rc_file }}"
  tags:
    - user
    - config
