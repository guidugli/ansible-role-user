---
- name: Find users with password max days outside policy
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: '($2~/^\$.+\$/) {if($5 > {{ user_max_days | int }} || $5 < 1) print $1}' /etc/shadow
  args:
    executable: /bin/bash
  register: user_password_max_days
  changed_when: false
  failed_when: user_password_max_days.rc != 0
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - validate

- name: Remediate user password max days
  ansible.builtin.command: "chage --maxdays {{ user_max_days }} {{ item }}"
  loop: "{{ user_password_max_days.stdout_lines | default([]) }}"
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - config

- name: Find users with password min days outside policy
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: '($2~/^\$.+\$/) {if($4 < {{ user_min_days | int }}) print $1}' /etc/shadow
  args:
    executable: /bin/bash
  register: user_password_min_days
  changed_when: false
  failed_when: user_password_min_days.rc != 0
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - validate

- name: Remediate user password min days
  ansible.builtin.command: "chage --mindays {{ user_min_days }} {{ item }}"
  loop: "{{ user_password_min_days.stdout_lines | default([]) }}"
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - config

- name: Find users with password warning days outside policy
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: '($2~/^\$.+\$/) {if($6 < {{ user_warn_age | int }}) print $1}' /etc/shadow
  args:
    executable: /bin/bash
  register: user_password_warn_days
  changed_when: false
  failed_when: user_password_warn_days.rc != 0
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - validate

- name: Remediate user password warning days
  ansible.builtin.command: "chage --warndays {{ user_warn_age }} {{ item }}"
  loop: "{{ user_password_warn_days.stdout_lines | default([]) }}"
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - config

- name: Find users with inactive days outside policy
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: '($2~/^\$.+\$/) {if($7 > {{ user_inactive_days | int }} || $7 < 0) print $1}' /etc/shadow
  args:
    executable: /bin/bash
  register: user_inactive_users
  changed_when: false
  failed_when: user_inactive_users.rc != 0
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - validate

- name: Remediate inactive setting for users
  ansible.builtin.command: "chage --inactive {{ user_inactive_days }} {{ item }}"
  loop: "{{ user_inactive_users.stdout_lines | default([]) }}"
  when: user_fix_existing_accounts | bool
  tags:
    - user
    - config

- name: Find users with a password change date in the future
  ansible.builtin.shell: |
    set -o pipefail
    while IFS= read -r user_name; do
      change_date=$(chage --list "$user_name" | awk -F: '/^Last password change/ {gsub(/^ +/, "", $2); print $2}')
      if [ "$change_date" != "never" ] && [ -n "$change_date" ]; then
        change_epoch=$(date -d "$change_date" +%s)
        now_epoch=$(date +%s)
        if [ "$change_epoch" -gt "$now_epoch" ]; then
          printf '%s\n' "$user_name"
        fi
      fi
    done < <(awk -F: '$2~/^\$.+\$/{print $1}' /etc/shadow)
  args:
    executable: /bin/bash
  register: user_future_password_change
  changed_when: false
  failed_when: false
  tags:
    - user
    - validate

- name: Report users with a password change date in the future
  ansible.builtin.fail:
    msg: >-
      Users have password change dates in the future and require manual remediation:
      {{ user_future_password_change.stdout_lines }}
  when: user_future_password_change.stdout | length > 0
  tags:
    - user
    - validate

- name: Find valid login shells
  ansible.builtin.shell: |
    set -o pipefail
    awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|'
  args:
    executable: /bin/bash
  register: user_valid_shells
  changed_when: false
  tags:
    - user
    - validate

- name: Find system accounts with valid login shells
  ansible.builtin.shell: |
    set -o pipefail
    uid_min=$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)
    awk -v pat="^({{ user_valid_shells.stdout }})$" -v uid_min="$uid_min" -F: \
      '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3 < uid_min || $3 == 65534) && $7 ~ pat) {print $1}' /etc/passwd
  args:
    executable: /bin/bash
  register: user_system_accounts_with_shell
  changed_when: false
  tags:
    - user
    - validate

- name: Set system account shells to nologin
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/sbin/nologin
  loop: "{{ user_system_accounts_with_shell.stdout_lines | default([]) }}"
  tags:
    - user
    - config

- name: Find local accounts without valid login shells that are not locked
  ansible.builtin.shell: |
    set -o pipefail
    valid_shells="^({{ user_valid_shells.stdout }})$"
    while IFS= read -r user_name; do
      passwd -S "$user_name" | awk '$2 !~ /^L/ {print $1}'
    done < <(awk -v pat="$valid_shells" -F: '($1 != "root" && $7 !~ pat) {print $1}' /etc/passwd)
  args:
    executable: /bin/bash
  register: user_unlocked_non_login_accounts
  changed_when: false
  tags:
    - user
    - validate

- name: Lock local accounts without valid login shells
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop: "{{ user_unlocked_non_login_accounts.stdout_lines | default([]) }}"
  tags:
    - user
    - config

- name: Find non-root UID 0 accounts
  ansible.builtin.shell: |
    awk -F: '($3 == 0 && $1 != "root") {print $1}' /etc/passwd
  args:
    executable: /bin/bash
  register: user_uid_zero_accounts
  changed_when: false
  failed_when: user_uid_zero_accounts.rc != 0
  tags:
    - user
    - validate

- name: Fail when non-root UID 0 accounts exist
  ansible.builtin.fail:
    msg: "Only root may have UID 0. Accounts requiring manual remediation: {{ user_uid_zero_accounts.stdout_lines }}"
  when: user_uid_zero_accounts.stdout | length > 0
  tags:
    - user
    - validate

- name: Read root primary GID
  ansible.builtin.shell: |
    awk -F: '$1 == "root" {print $4}' /etc/passwd
  args:
    executable: /bin/bash
  register: user_root_primary_gid
  changed_when: false
  failed_when: user_root_primary_gid.rc != 0
  tags:
    - user
    - validate

- name: Ensure root account primary GID is 0
  ansible.builtin.command: "usermod -g 0 root"
  when: user_root_primary_gid.stdout | int != 0
  tags:
    - user
    - config

- name: Find non-root groups with GID 0
  ansible.builtin.shell: |
    awk -F: '($3 == 0 && $1 != "root") {print $1}' /etc/group
  args:
    executable: /bin/bash
  register: user_gid_zero_groups
  changed_when: false
  failed_when: user_gid_zero_groups.rc != 0
  tags:
    - user
    - validate

- name: Fail when non-root GID 0 groups exist
  ansible.builtin.fail:
    msg: "Only group root may have GID 0. Groups requiring manual remediation: {{ user_gid_zero_groups.stdout_lines }}"
  when: user_gid_zero_groups.stdout | length > 0
  tags:
    - user
    - validate

- name: Remove nologin entries from /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    regexp: '^\s*[^#\n\r]*/nologin\b.*$'
    state: absent
  tags:
    - user
    - config

- name: Ensure root PATH integrity
  ansible.builtin.script: files/path_check.sh
  register: user_root_path_check
  changed_when: false
  failed_when: user_root_path_check.rc != 0
  tags:
    - user
    - validate

- name: Run user account audit helper scripts
  ansible.builtin.script: "files/{{ item }}"
  loop:
    - check_homedir_exists.sh
    - check_homedir.sh
    - homedir_owner_check.sh
    - user_dot_file_check.sh
    - check_forward_files.sh
    - check_netrc.sh
    - check_netrc_perms.sh
    - find_rhosts.sh
    - check_groups.sh
    - check_dup_uid.sh
    - check_dup_gid.sh
    - check_dup_user_names.sh
    - check_dup_group_names.sh
  register: user_audit_scripts
  changed_when: false
  failed_when: user_audit_scripts.rc != 0
  tags:
    - user
    - validate

- name: Validate /etc/shadow ownership and permissions on Debian family
  ansible.builtin.stat:
    path: /etc/shadow
  register: shadow_stat
  tags:
    - user
    - validate

- name: Assert Debian shadow file permissions
  ansible.builtin.assert:
    that:
      - shadow_stat.stat.gr_name == 'shadow'
      - shadow_stat.stat.pw_name == 'root'
    quiet: true
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - user
    - validate
