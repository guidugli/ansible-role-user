---
- name: Validate numeric role settings
  ansible.builtin.assert:
    that:
      - user_max_days is defined
      - user_min_days is defined
      - user_inactive_days is defined
      - user_warn_age is defined
      - user_shell_timeout is defined
      - user_max_days | int > 0
      - user_min_days | int >= 0
      - user_inactive_days | int >= 0
      - user_warn_age | int >= 0
      - user_shell_timeout | int > 0
    quiet: true
  tags:
    - user
    - validate

- name: Validate CIS numeric policy boundaries
  ansible.builtin.assert:
    that:
      - user_max_days | int <= 365
      - user_min_days | int > 0
      - user_warn_age | int >= 7
      - user_inactive_days | int <= 45
      - user_shell_timeout | int <= 900
    quiet: true
  tags:
    - user
    - validate

- name: Validate umask setting
  ansible.builtin.assert:
    that:
      - user_umask is defined
      - user_umask is string
      - user_umask is regex('^[0-7]{3,4}$')
    quiet: true
  tags:
    - user
    - validate

- name: Validate boolean options
  ansible.builtin.assert:
    that:
      - user_skip_config is defined
      - user_fix_existing_accounts is defined
      - user_configure_single_user is defined
      - user_skip_config | type_debug == 'bool'
      - user_fix_existing_accounts | type_debug == 'bool'
      - user_configure_single_user | type_debug == 'bool'
    quiet: true
  tags:
    - user
    - validate

- name: Validate password encryption method
  ansible.builtin.assert:
    that:
      - user_encrypt_method is defined
      - user_encrypt_method is string
      - user_encrypt_method in ['YESCRYPT', 'SHA512', 'SHA256', 'BCRYPT', 'DES', 'MD5']
      - user_encrypt_method in ['YESCRYPT', 'SHA512']
    quiet: true
  tags:
    - user
    - validate

- name: Validate user account definitions
  vars:
    user_path_regex: '^/'
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.uid is not defined or (item.uid | int > 0)
      - item.shell is not defined or item.shell is regex(user_path_regex)
      - item.password is not defined or item.password is string
      - item.linger is not defined or item.linger | type_debug == 'bool'
    quiet: true
  loop: "{{ user_account_add }}"
  loop_control:
    label: "{{ item.name | default('undefined') }}"
  tags:
    - user
    - validate

- name: Validate group definitions
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.gid is not defined or (item.gid | int > 0)
    quiet: true
  loop: "{{ user_group_add }}"
  loop_control:
    label: "{{ item.name | default('undefined') }}"
  tags:
    - user
    - validate

- name: Validate users and groups to be removed
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
    quiet: true
  loop: "{{ user_account_remove + user_group_remove }}"
  tags:
    - user
    - validate

- name: Validate alias definitions
  ansible.builtin.assert:
    that:
      - item.user is defined
      - item.user is string
      - item.user | length > 0
      - item.alias is defined
      - item.alias is string
      - item.alias | length > 0
      - item.state is defined
      - item.state in ['present', 'absent']
      - item.command is defined or item.state == 'absent'
      - item.command is not defined or item.command is string
    quiet: true
  loop: "{{ user_alias }}"
  tags:
    - user
    - validate
