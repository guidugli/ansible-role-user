---
# defaults file for user settings

# If true, skip login definition and account-hardening configuration and only manage users/groups.
user_skip_config: false

# Optional replacement password used only to refresh ansible_become_pass for subsequent tasks.
user_new_password: ""

# Configure rescue/emergency single-user shell handling. Requires a root password or locked root account.
user_configure_single_user: false

# Password aging defaults aligned with CIS user-account guidance.
user_max_days: 365
user_min_days: 7
user_inactive_days: 30
user_warn_age: 7

# Default user umask. CIS guidance expects 027 or more restrictive.
user_umask: "027"

# Shell inactivity timeout in seconds. CIS guidance expects 900 seconds or less.
user_shell_timeout: 900

# Run validation and remediation tasks for existing local users/groups.
user_fix_existing_accounts: true

# Password hashing algorithm for /etc/login.defs.
user_encrypt_method: "YESCRYPT"

# Optional algorithm tuning parameters for /etc/login.defs.
user_sha_crypt_max_rounds: null
user_bcrypt_min_rounds: null
user_bcrypt_max_rounds: null
user_yescrypt_cost_factor: null

# Optional root password hash. Leave empty to avoid changing the root password.
root_password: ""

# User/group management inputs.
user_account_add: []
user_account_remove: []
user_group_add: []
user_group_remove: []
user_alias: []
